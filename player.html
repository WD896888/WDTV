<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=overlays-content">
    <meta name="referrer" content="same-origin">
    <title>WDTV 播放器</title>

    <!-- Favicon -->
    <link rel="icon" href="image/logo.png">
    <link rel="apple-touch-icon" href="image/logo-black.png">
    <link rel="manifest" href="manifest.json">

    <!-- Dynamic effects pre-paint: apply fx-off class before first paint to avoid flash -->
    <script>
    (function(){
      try{
        if(localStorage.getItem('dynamicEffectsEnabled')==='false'){
          document.documentElement.classList.add('fx-off');
        }
      }catch(e){}
    })();
    </script>

    <script src="libs/tailwindcss.min.js"></script>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/player.css?v=6">

    <meta http-equiv="Cache-Control" content="no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400;1,600&family=Noto+Sans+SC:wght@300;400;500&family=Noto+Serif+SC:wght@400;500;600&family=Raleway:wght@200;300&display=swap');

    /* 全局紧凑化：根字号缩小 12.5%~19%，页面所有 rem 尺寸（Tailwind 字号/间距/组件）等比缩小，
       桌面/平板 14px，手机 13px（触控目标仍保持可用） */
    html{font-size:14px}
    @media (max-width:640px){html{font-size:13px}}

    :root{
      --bg-deep:#181e32;--bg-mid:#263050;
      --mist:#8895b4;--silver:#b2c0d8;--light:#cdd6ea;--pale:#e2e9f5;--white:#eff2fa;
      --accent:#2c5aa0;--accent-light:#6a9ae0;
      --glass-bg:rgba(200,220,245,0.13);--glass-border:rgba(200,220,245,0.42);--glass-shadow:rgba(0,0,0,0.3);
      --text-primary:rgba(236,244,255,0.96);--text-secondary:rgba(180,200,230,0.7);--text-muted:rgba(180,200,230,0.5);
      --transition:cubic-bezier(0.4,0,0.2,1);
      --gw-ar:1.924779;--gw-h:100vh;--gw-w:100vw;
    }

    body.player-page-bg{
      font-family:'Noto Sans SC',sans-serif !important;
      font-weight:300;
      background:var(--bg-deep) !important;
      color:var(--text-primary) !important;
      overflow-x:hidden;
      min-height:100vh;
    }

    /* PRELOADER */
    #preloader{position:fixed;inset:0;z-index:100000;display:flex;align-items:center;justify-content:center;flex-direction:column;
      background:radial-gradient(ellipse 90% 70% at 50% 45%,rgba(30,44,72,0.98),rgba(18,28,50,0.99));
      transition:opacity 1.2s ease-out,visibility 1.2s ease-out}
    #preloader.fade-out{opacity:0;visibility:hidden;pointer-events:none}
    #preloader .preloader-text{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:20px;color:rgba(225,235,250,0.85);
      letter-spacing:0.15em;text-shadow:0 0 16px rgba(180,200,240,0.25),0 1px 8px rgba(0,0,0,0.4);animation:loadPulse 1.5s ease-in-out infinite}
    #preloader .preloader-sub{font-family:'Raleway','Noto Sans SC',sans-serif;font-weight:300;font-size:11px;color:rgba(180,200,230,0.4);
      letter-spacing:0.12em;margin-top:18px}
    @keyframes loadPulse{0%{opacity:0.6}50%{opacity:1}100%{opacity:0.6}}

    /* RAIN */
    #rain-container{opacity:0;transition:opacity 2s ease-out}
    #rain-container.rain-visible{opacity:1}
    #rain-container canvas{position:fixed;inset:0;z-index:10001;pointer-events:none;width:100vw;height:100vh}

    /* SPLASH (background) */
    #splash{position:fixed;inset:0;z-index:1;display:block;
      background:rgba(15,41,95,0.52);backdrop-filter:blur(30px) saturate(0.72) brightness(0.92);-webkit-backdrop-filter:blur(30px) saturate(0.72) brightness(0.92);
      pointer-events:auto}
    .splash-glow{position:absolute;inset:0;z-index:0;pointer-events:none;
      background:
        radial-gradient(ellipse 120% 95% at 74% 16%, rgba(186,212,247,0.22) 0%, rgba(176,204,242,0.10) 34%, transparent 66%),
        radial-gradient(ellipse 90% 40% at 50% 88%, rgba(130,162,210,0.18) 0%, rgba(130,162,210,0.07) 42%, transparent 72%),
        linear-gradient(to bottom, transparent 38%, rgba(148,180,228,0.08) 66%, transparent 92%),
        linear-gradient(to bottom, rgba(150,184,234,0.22) 0%, rgba(126,162,216,0.18) 50%, rgba(106,142,200,0.16) 100%);
      animation:splashDawn 58s ease-in-out infinite alternate}
    @keyframes splashDawn{0%{opacity:0.88;filter:brightness(1.0) saturate(1.03)}100%{opacity:1;filter:brightness(1.08) saturate(1.06)}}

    /* Scrollbar */
    ::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:rgba(175,195,228,0.2);border-radius:2px}

    /* GLASS CANVAS (water ripple) */
    #gw-slot{position:fixed;z-index:1;left:0;top:0;width:var(--gw-w);height:var(--gw-h);--gwfx:140px;--gwfy:68px;transition:opacity .5s ease,visibility .5s ease,filter .45s ease}
    #gw-pane{position:absolute;inset:0;border-radius:28px;overflow:hidden;cursor:crosshair;
      -webkit-mask-image:linear-gradient(to right,rgba(0,0,0,.34),rgba(0,0,0,.62) calc(var(--gwfx)*.42),rgba(0,0,0,.86) calc(var(--gwfx)*.72),#000 var(--gwfx),#000 calc(100% - var(--gwfx)),rgba(0,0,0,.86) calc(100% - var(--gwfx)*.72),rgba(0,0,0,.62) calc(100% - var(--gwfx)*.42),rgba(0,0,0,.34)),
                         linear-gradient(to bottom,transparent,rgba(0,0,0,.22) calc(var(--gwfy)*.45),rgba(0,0,0,.68) calc(var(--gwfy)*.78),#000 var(--gwfy),#000 calc(100% - var(--gwfy)),rgba(0,0,0,.68) calc(100% - var(--gwfy)*.78),rgba(0,0,0,.22) calc(100% - var(--gwfy)*.45),transparent);
      -webkit-mask-composite:source-in;-webkit-mask-repeat:no-repeat;
      mask-image:linear-gradient(to right,rgba(0,0,0,.34),rgba(0,0,0,.62) calc(var(--gwfx)*.42),rgba(0,0,0,.86) calc(var(--gwfx)*.72),#000 var(--gwfx),#000 calc(100% - var(--gwfx)),rgba(0,0,0,.86) calc(100% - var(--gwfx)*.72),rgba(0,0,0,.62) calc(100% - var(--gwfx)*.42),rgba(0,0,0,.34)),
                 linear-gradient(to bottom,transparent,rgba(0,0,0,.22) calc(var(--gwfy)*.45),rgba(0,0,0,.68) calc(var(--gwfy)*.78),#000 var(--gwfy),#000 calc(100% - var(--gwfy)),rgba(0,0,0,.68) calc(100% - var(--gwfy)*.78),rgba(0,0,0,.22) calc(100% - var(--gwfy)*.45),transparent);
      mask-composite:intersect;mask-repeat:no-repeat}
    .gw-ly{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
    .gw-img{z-index:1;background-size:cover;background-position:center;opacity:0;transition:opacity 1.1s ease;filter:saturate(0.92) brightness(0.97)}
    #gw-slot.gw-has-img .gw-img{opacity:1}
    #gw-ripple{z-index:1;opacity:0;transition:opacity 1.1s ease;will-change:transform}
    #gw-slot.gw-rippling #gw-ripple{opacity:1}
    #gw-slot.gw-gloss #gw-ripple{mix-blend-mode:overlay}
    #gw-ripple-bg{position:absolute;inset:0;z-index:2;width:100%;height:100%;pointer-events:none;opacity:0;transition:opacity 1.1s ease;will-change:transform}
    #gw-ripple-bg.on{opacity:1}
    .gw-grade-c{z-index:2;background:#3a5587;mix-blend-mode:color;opacity:0;transition:opacity 1.2s ease}
    #gw-slot.gw-has-img .gw-grade-c{opacity:0.34}
    .gw-grade-s{z-index:2;background:linear-gradient(168deg,rgba(198,218,248,0.16) 0%,rgba(14,26,50,0.30) 80%);mix-blend-mode:soft-light;opacity:0;transition:opacity 1.2s ease}
    #gw-slot.gw-has-img .gw-grade-s{opacity:1}
    .gw-depth{z-index:3;background:radial-gradient(130% 160% at 50% 46%,rgba(12,22,44,0) 46%,rgba(12,22,44,0.18) 76%,rgba(12,22,44,0.34) 100%)}
    .gw-frost{z-index:4;opacity:0.55;transition:opacity .4s ease;background:linear-gradient(rgba(16,28,54,0.06),rgba(16,28,54,0.06)),linear-gradient(150deg,rgba(184,204,236,0.07) 0%,rgba(112,136,178,0.04) 52%,rgba(86,108,150,0.07) 100%)}
    #gw-fogwipe{z-index:5}
    /* 小屏不再隐藏背景图面板（#gw-slot），与桌面端保持一致；
       小屏性能优化：背景图显示后每帧都要叠加水波画布，裁掉昂贵的合成特效（全屏面板的边缘渐隐在移动端不可见，着色层改用普通半透明叠加） */
    #gw-pane{-webkit-mask-image:none;mask-image:none}
    .gw-img{filter:none}
    .gw-grade-c{mix-blend-mode:normal}
    .gw-grade-s{mix-blend-mode:normal}

    /* === FX OFF（动态效果关闭模式：停用动画与背景水滴/水波特效） ===
       注意：不改动任何窗口/控件的玻璃样式（backdrop-filter、阴影等全部保留） */
    html.fx-off *{animation:none!important;transition:none!important}
    html.fx-off #preloader,html.fx-off #rain-container,html.fx-off #gw-slot,html.fx-off #gw-ripple-bg{display:none!important}

    /* Content layering above splash */
    header{position:relative;z-index:9000}
    main{position:relative;z-index:10;pointer-events:none}
    main button,main input,main a,main label,main select,main textarea,
    main #player,main .art-video-player,main video,main .switch,
    main .episode-grid,main #episodesGrid,main #episodesList,
    main #resourceInfoBarContainer{pointer-events:auto}
    footer{position:relative;z-index:10;pointer-events:none;color:rgba(180,200,230,0.7)}
    footer svg{color:rgba(180,200,230,0.7)}
    footer a{pointer-events:auto}
    #modal,#passwordModal{z-index:10000}
    .shortcut-hint{pointer-events:none}

    /* 面板风格覆盖：容器层浅色文字 + 内部控制层深色文字 */
    #videoTitle{color:rgba(222,234,250,0.92) !important}
    .gradient-text{background:linear-gradient(135deg,#6a9ae0 0%,#4a7cc9 50%,#2c5aa0 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    /* 深色背景上的裸文字 — 浅色保证可读 */
    .text-gray-600{color:rgba(180,200,230,0.85) !important}
    .text-gray-500{color:rgba(180,200,230,0.6) !important}
    .text-red-500{color:#ff6b8a !important}

    /* 密码模态框内部控件 — 内部控制层玻璃（与首页面板按钮一致） */
    #passwordModal .password-input{
      background:rgba(255,255,255,0.45) !important;
      border:1px solid rgba(200,220,245,0.3) !important;
      color:#2a3a5c !important;
      border-radius:8px !important;
      padding:10px 14px !important;
      outline:none !important;
      text-shadow:none !important;
    }
    #passwordModal .password-input::placeholder{color:rgba(42,58,92,0.4)}
    #passwordModal .password-input:focus{
      border-color:rgba(200,220,245,0.6) !important;
      box-shadow:0 0 0 3px rgba(200,220,245,0.15) !important;
    }
    #passwordModal .ios-primary-button{
      background:rgba(255,255,255,0.3) !important;
      border:1px solid rgba(255,255,255,0.2) !important;
      color:#2a3a5c !important;
      border-radius:8px !important;
      padding:10px 14px !important;
      font-weight:500 !important;
      letter-spacing:0.06em !important;
      text-shadow:none !important;
      box-shadow:none !important;
      cursor:pointer !important;
      transition:all 0.2s !important;
    }
    #passwordModal .ios-primary-button:hover{
      background:rgba(255,255,255,0.45) !important;
      border-color:rgba(255,255,255,0.4) !important;
    }
    </style>
</head>
<body class="player-page-bg">
    <!-- Preloader -->
    <div id="preloader">
      <p class="preloader-text">Now Loading...</p>
      <p class="preloader-sub">preparing your space</p>
    </div>

    <!-- Rain -->
    <div id="rain-container"></div>

    <!-- Splash with glass water ripple background -->
    <div id="splash">
      <div class="splash-glow"></div>
      <canvas id="gw-ripple-bg"></canvas>
      <div id="gw-slot">
        <div id="gw-pane">
          <div class="gw-ly gw-img" id="gw-img"></div>
          <canvas id="gw-ripple" class="gw-ly"></canvas>
          <div class="gw-ly gw-grade-c"></div>
          <div class="gw-ly gw-grade-s"></div>
          <div class="gw-ly gw-frost"></div>
          <div class="gw-ly gw-depth"></div>
          <canvas id="gw-fogwipe" class="gw-ly"></canvas>
        </div>
      </div>
    </div>

    <header class="player-header-fixed p-4 flex items-center gap-2">
        <div class="flex-1 flex items-center min-w-0">
            <button id="homeButton" type="button" class="flex items-center min-w-0 cursor-pointer home-button">
                <h1 class="text-xl font-bold gradient-text logo-text">WDTV</h1>
            </button>
            <a href="#" id="goBack" onclick="goBack(event)" class="player-glass-button flex items-center min-w-0 home-btn ml-2">
                <svg class="w-5 h-5 mr-1" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                    <path d="M5.25 11h15a1.5 1.5 0 1 1 0 3H5.25a1.5 1.5 0 0 1 0-3z"/>
                    <path d="M5.55 12 11.3 17.3a1.5 1.5 0 1 1-2.12 2.12L3 12l6.18-6.18a1.5 1.5 0 1 1 2.12 2.12L5.55 12z"/>
                </svg>
                <span class="home-btn-text">上一页</span>
            </a>
        </div>
        <h2 id="videoTitle" class="text-xl font-semibold text-center overflow-x-auto whitespace-nowrap truncate custom-title-scroll min-w-0 max-w-full" style="color: rgba(222,234,250,0.92);"></h2>
        <div class="flex-1"></div>
    </header>

    <!-- 密码验证弹窗 - 容器层玻璃 -->
    <div id="passwordModal" class="fixed inset-0 hidden items-center justify-center z-[65] transition-opacity duration-300" style="background: rgba(200,220,245,0.25); backdrop-filter: blur(32px) saturate(1.5); -webkit-backdrop-filter: blur(32px) saturate(1.5);">
        <div class="p-8 rounded-3xl w-11/12 max-w-md max-h-[90vh] flex flex-col" style="background: rgba(200,220,245,0.13); backdrop-filter: blur(32px) saturate(1.5); -webkit-backdrop-filter: blur(32px) saturate(1.5); border: 1px solid rgba(200,220,245,0.42); box-shadow: 0 24px 80px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.1); color: rgba(236,244,255,0.96);">
            <div class="flex justify-between items-center mb-6 flex-none">
                <h2 class="text-2xl font-bold gradient-text">访问验证</h2>
            </div>
            <div class="mb-6">
                <p class="text-gray-600 mb-4">请输入密码继续访问</p>
                <form id="passwordForm" onsubmit="handlePasswordSubmit(); return false;">
                    <input type="text" name="username" id="username" autocomplete="username" style="display:none" tabindex="-1" aria-hidden="true">
                    <input type="password" id="passwordInput" class="password-input w-full" placeholder="密码..." autocomplete="new-password">
                    <button id="passwordSubmitBtn" type="submit" class="ios-primary-button mt-4 w-full">提交</button>
                </form>
                <p id="passwordError" class="text-red-500 mt-2 hidden">密码错误，请重试</p>
            </div>
        </div>
    </div>

    <main class="container mx-auto px-4 py-4">        <!-- 视频播放区 -->
        <div id="playerContainer" class="player-container mb-4">
            <div class="relative">
                <div id="player" class="player-placeholder">
                </div>
                <div class="error-container" id="error">
                    <div class="error-icon">⚠️</div>
                    <div id="error-message">视频加载失败</div>
                    <div class="error-message-sub">请尝试其他视频源或稍后重试</div>
                </div>
            </div>
        </div>

        <!-- 源信息 -->
        <div id="resourceInfoBarContainer" class="player-container flex justify-between items-center mb-2">
            <!-- 资源信息卡片、切换按钮、视频数将由JS动态渲染 -->
        </div>

        <!-- 集数导航 -->
        <div class="player-container">
            <div class="flex justify-center items-center my-4">
                <span class="text-gray-600 font-medium" id="episodeInfo">加载中...</span>
            </div>
        </div>

        <!-- 添加自动播放开关和排序按钮 -->
        <div class="player-container mb-2">
            <div class="flex flex-wrap items-center gap-2">
                <!-- 自动连播开关 -->
                <div class="flex items-center gap-1 flex-shrink-0 mr-auto">
                    <span class="text-gray-600 whitespace-nowrap">自动连播</span>
                    <label class="switch">
                        <input type="checkbox" id="autoplayToggle">
                        <span class="slider"></span>
                    </label>
                </div>

                <!-- 倒序排列按钮（纯图标，无包裹） -->
                <button onclick="toggleEpisodeOrder()" id="orderButton" title="倒序排列"
                        class="player-icon-button flex-shrink-0">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" id="orderIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16M8 8l4-4 4 4M8 16l4 4 4-4" />
                    </svg>
                </button>
            </div>
        </div>

        <!-- 集数网格 -->
        <div class="player-container">
            <div class="episode-grid" id="episodesGrid">
                <div class="grid" id="episodesList">
                    <!-- 集数将在这里动态加载 -->
                    <div class="col-span-full text-center text-gray-500 py-8">加载中...</div>
                </div>
            </div>
        </div>
    </main>

    <!-- 添加快捷键提示元素 -->
    <div class="shortcut-hint" id="shortcutHint">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" id="shortcutIcon">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
        </svg>
        <span id="shortcutText"></span>
    </div>

    <!-- 页脚区域 - 液态玻璃 -->
    <footer class="footer mt-2 py-6">
        <div class="container mx-auto px-4">
            <div class="flex flex-col md:flex-row justify-between items-center">
                <div class="mb-4 md:mb-0">
                    <div class="flex items-center justify-center md:justify-start">
                        <svg class="w-6 h-6 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
                        </svg>
                        <span class="gradient-text font-bold">WDTV</span>
                    </div>
                    <p class="text-gray-500 text-sm mt-2 text-center md:text-left">© 2026 WDTV - 自由观影，畅享精彩</p>
                </div>

                <div class="text-center md:text-right">
                    <p class="text-gray-500 text-sm max-w-md">
                        免责声明：本站仅为视频搜索工具，不存储、上传或分发任何视频内容。
                        所有视频均来自第三方API接口。如有侵权，请联系相关内容提供方。
                    </p>
                    <div class="mt-2 flex justify-center md:justify-end space-x-4">
                        <a href="about.html" class="text-gray-500 hover:text-blue-500 text-sm transition-colors">关于我们</a>
                        <a href="about.html" class="text-gray-500 hover:text-blue-500 text-sm transition-colors">隐私政策</a>
                    </div>
                </div>
            </div>
        </div>
    </footer>

    <!-- 换源模态框 - 容器层玻璃 -->
    <div id="modal" class="fixed inset-0 hidden flex items-center justify-center transition-opacity duration-300 z-[10000]" style="background: rgba(200,220,245,0.25); backdrop-filter: blur(32px) saturate(1.5); -webkit-backdrop-filter: blur(32px) saturate(1.5);">
        <div class="p-8 rounded-3xl w-11/12 max-w-4xl max-h-[90vh] flex flex-col" style="background: rgba(200,220,245,0.13); backdrop-filter: blur(32px) saturate(1.5); -webkit-backdrop-filter: blur(32px) saturate(1.5); border: 1px solid rgba(200,220,245,0.42); box-shadow: 0 24px 80px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.1); color: rgba(236,244,255,0.96);">
            <div class="flex justify-between items-center mb-6 flex-none">
                <h2 id="modalTitle" class="text-2xl font-bold gradient-text break-words pr-4 max-w-[80%]"></h2>
                <button onclick="closeModal()" class="text-2xl transition-colors flex-shrink-0 w-9 h-9 rounded-full flex items-center justify-center" style="background: transparent; border: none; color: rgba(222,234,250,0.92);">&times;</button>
            </div>
            <div id="modalContent" class="overflow-auto flex-1 min-h-0">

    <!-- Rain -->
    <script>
    (function(){
      if(document.documentElement.classList.contains('fx-off'))return;
      var box=document.getElementById('rain-container');
      if(!box)return;
      var cv=document.createElement('canvas');box.appendChild(cv);
      var ctx=cv.getContext('2d');
      var dpr=Math.max(1,Math.min(2,devicePixelRatio||1));
      var W=0,H=0;
      function R(a,b){return a+Math.random()*(b-a)}
      var WIND=24;
      var drops=[];
      function reset(d){
        d.z=R(0.35,1);d.x=Math.random()*W;d.v=(380+R(0,320))*d.z;
        d.y=-R(0.05,1.2)*d.v;d.w=1.8+d.z*0.8;d.wf=R(0.8,1.2);
      }
      function size(){
        W=innerWidth;H=innerHeight;
        cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
        drops.length=0;
        for(var i=0;i<45;i++){var d={};reset(d);drops.push(d)}
      }
      var last=0;
      function loop(ts){
        requestAnimationFrame(loop);
        var dt=Math.min(0.05,(ts-last)/1000||0.016);last=ts;
        ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);ctx.lineCap='round';
        for(var i=0;i<drops.length;i++){
          var d=drops[i];var wz=WIND*d.z*d.wf;d.y+=d.v*dt;d.x+=wz*dt;
          if(d.x>W+30)d.x-=W+60;
          var len=Math.min(72,d.v*0.1);
          if(d.y-len>H){reset(d);continue}
          if(d.y<-40)continue;
          var a=0.18+0.26*d.z;
          var tx=d.x-wz*(len/d.v),ty=d.y-len;
          var g=ctx.createLinearGradient(tx,ty,d.x,d.y);
          g.addColorStop(0,'rgba(200,220,242,0)');
          g.addColorStop(0.62,'rgba(208,225,245,'+(a*0.55).toFixed(3)+')');
          g.addColorStop(1,'rgba(218,232,250,'+Math.min(0.5,a*1.15).toFixed(3)+')');
          ctx.strokeStyle=g;ctx.lineWidth=d.w;
          ctx.beginPath();ctx.moveTo(tx,ty);ctx.lineTo(d.x,d.y);ctx.stroke();
          ctx.fillStyle='rgba(224,238,252,'+Math.min(0.45,a*0.9).toFixed(3)+')';
          ctx.beginPath();ctx.arc(d.x,d.y,d.w*0.55,0,6.2832);ctx.fill();
        }
      }
      addEventListener('resize',size);size();requestAnimationFrame(loop);
    })();
    </script>

    var stirPts={};
