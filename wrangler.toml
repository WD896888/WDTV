# Cloudflare Pages 项目配置（Git 集成部署与 `npx wrangler pages deploy` 均读取本文件）
# 注意：存在本文件后，非敏感环境变量以 [vars] 为准，Dashboard 中的同名变量将被忽略；
# 敏感变量（AUTH_SECRET）请用 secret：npx wrangler pages secret put AUTH_SECRET --project-name=wdtv
# ⚠️ AUTH_SECRET 关键警告：它同时决定 JWT 签名与所有账号的密码哈希。
#    1) 请在首个账号注册【之前】设置好，设置后【永远不要更改或删除】——
#       任何变动都会使全部已注册账号立即无法登录（只能重新注册）；
#    2) 未设置时系统回退到公开默认值（与本地开发一致，可用但不安全），
#       部署后可访问 /api/config 检查 authSecretSet 字段自检。
name = "wdtv"
compatibility_date = "2025-09-01"
# 部署暂存目录：由 deploy-pages.mjs 按白名单构建（严禁直接设为 "." ——
# wrangler pages deploy 不读 .assetsignore，直接部署根目录会把 server.mjs、
# data/（本地账号库）、日志、测试脚本等全部公开）
pages_build_output_dir = "deploy-dist"

# 代理函数使用的环境变量
[vars]
DEBUG = "false"
# 二进制内容（ts 分片、图片等）缓存时长（秒）
CACHE_TTL = "86400"
# M3U8 播放列表缓存时长（秒）——短缓存，避免换源/动态列表拿到陈旧数据
M3U8_CACHE_TTL = "120"
# 是否开放注册（设为 "false" 关闭；缺省或其它值均视为开放）
ALLOW_REGISTER = "true"
# 弹幕转发层（official 模式）：弹弹play 官方 API（api.dandanplay.net）经同源转发层 /danmu/ 接入，
# 前端 js/danmu.js 的首选数据源（启动探测 /danmu/ 返回 {configured:true, mode:'official'} 后自动启用）。
# AppId 非敏感（随每次请求 X-AppId 头明文携带）放 [vars]；AppSecret 为敏感凭据，必须用 secret 设置：
#   npx wrangler pages secret put DANMU_APP_SECRET --project-name=wdtv
DANMU_APP_ID = "ejwvjhghym"
# 历史教训（勿恢复旧配置）：
#   1) DANMU_BASE 指向 workers.dev —— CF 平台禁止 Worker/Pages Function 回源 *.workers.dev
#      （上游返回 CF error code: 1042），此路本就不通；
#   2) DANMU_BASE 指向 fcapp.run —— CF 海外边缘 → 阿里云 FC（中国）跨境连接受阻（20~30s 超时 502）；
#   3) 2026-09 起主数据源切换为弹弹play官方 API；原 CF Workers 自建源（工程 danmu-api-worker，
#      https://danmu.wdmatch1.dpdns.org/zrt1ym8hlfq6，前端内置直连）降为官方源之后的备用源。
# DANMU_BASE = "https://danmu-api.1936371568.workers.dev/zrt1ym8hlfq6"

# M3U8 代理缓存（已创建并绑定）
# 命名空间: npx wrangler kv namespace create LIBRETV_PROXY_KV
[[kv_namespaces]]
binding = "LIBRETV_PROXY_KV"
id = "2c83fb3ae9214837b21f9d84d4cdd821"

# 账号系统数据库（D1）。首次部署：
#   npx wrangler d1 create wdtv-users
#   npx wrangler d1 execute wdtv-users --file=./schema.sql --remote
# 将返回的 database_id 填到下面
# 片头片尾公共库（skip_marks_public）也由同一份 schema.sql 创建；
# 旧部署升级时重跑上面的 execute 即可（CREATE TABLE IF NOT EXISTS，幂等）。
# 该表只读：前端仅通过 GET /api/skip-marks 查询，没有任何写入/上传接口。
[[d1_databases]]
binding = "WDTV_DB"
database_name = "wdtv-users"
database_id = "83bf889c-410e-482f-bdca-1b5890334d64"

# ===== 双人共同观影实时服务（Durable Object，独立 Worker 项目 sync-worker/） =====
# 部署：cd sync-worker && npx wrangler deploy
# secret：npx wrangler secret put AUTH_SECRET --name wdtv-sync-worker（必须与本项目 AUTH_SECRET 同值）
[[durable_objects.bindings]]
name = "WATCH_ROOM"
class_name = "WatchRoom"
script_name = "wdtv-sync-worker"
